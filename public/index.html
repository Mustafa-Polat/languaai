<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffd95a" />
    <meta name="description" content="Oxford 3000 kelime listesiyle AI destekli İngilizce öğrenme uygulaması" />

    <!-- PWA -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/icon.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png" />

    <!-- iOS PWA desteği -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LinguaAI" />

    <style>
      button { transition: transform .12s ease, filter .15s ease, box-shadow .15s ease, background .2s ease; -webkit-tap-highlight-color: transparent; }
      button:not(:disabled):hover { filter: brightness(1.12); }
      button:not(:disabled):active { transform: scale(0.96); }
      button:focus-visible { outline: 2px solid #ffd95a; outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) { button { transition: none; } }
    </style>
    <!-- Safe area (iPhone notch desteği) -->
    <style>
      body {
        margin: 0;
        padding: 0;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        background: #0a0a0f;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
      }
      * { box-sizing: border-box; }
    </style>

    <title>LinguaAI</title>
  </head>
  <body>
    <noscript>Bu uygulamayı kullanmak için JavaScript etkinleştirmeniz gerekiyor.</noscript>
    <div id="root"></div>
  </body>
</html>
